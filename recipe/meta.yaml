{% set python_min = "3.10" %}
{% set name = "activity-browser" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/LCA-ActivityBrowser/{{ name }}/archive/{{ version }}.tar.gz
  sha256: 728a642f7ac069a6162b5590e4aaee7a3b8346821e7e455b81e4897261c93b9a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  entry_points:
    - activity-browser = activity_browser:run_activity_browser
  script_env:
    - QT_QPA_PLATFORM=offscreen

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }},<3.12
    - arrow
    - brightway2 =2.4.6
    - ecoinvent_interface >=3.1
    - networkx
    - numpy >=1.23.5
    - pandas >=2.2.1
    - pint <=0.21
    - pyperclip
    - pyside2 >=5.15.5
    - qt-webengine
    - salib >=1.4,<1.5.1
    - seaborn

test:
  requires:
    - python {{ python_min }}
  imports:
    - activity_browser
  # No test of activity-browser as no --help or --version available

about:
  home: https://github.com/LCA-ActivityBrowser/activity-browser
  summary: A graphical user interface for brightway2
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file: LICENSE.txt
  dev_url: https://github.com/LCA-ActivityBrowser/activity-browser

extra:
  recipe-maintainers:
    - marc-vdm
    - bsteubing
    - haasad
    - m-rossi
    - mrvisscher
